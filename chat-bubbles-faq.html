<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat‑Bubbles FAQ — Vanilla</title>
    <style>
      :root {
        --surface-from: #fffdfb;
        --surface-to: #fff6ee;
        --text-strong: #1a1a1a;
        --text: #404040;
        --bubble-q: #f5f5f5;
        --bubble-a: #ffffff;
        --ring: rgba(163, 163, 163, 0.6);
        --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
        --radius: 16px;
        --speed: 280ms;
        --easing: cubic-bezier(.4,0,.2,1);
        --max-w: 44ch; /* bubble width */
      }

      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Noto Sans, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji";
        color: var(--text);
        background: linear-gradient(to bottom, var(--surface-from), var(--surface-to));
      }

      .faq-section {
        max-width: 720px;
        margin-inline: auto;
        padding: 40px 16px 56px;
      }
      .faq-heading {
        margin: 0 0 24px;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--text-strong);
      }
      .faq-list { display: flex; flex-direction: column; gap: 16px; list-style: none; padding: 0; margin: 0; }

      /* Question bubble */
      .q-btn {
        max-width: var(--max-w);
        padding: 10px 14px;
        border: 0;
        border-radius: var(--radius);
        background: var(--bubble-q);
        color: var(--text-strong);
        box-shadow: var(--shadow);
        text-align: start;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        outline: none;
      }
      .q-btn:focus-visible {
        box-shadow: var(--shadow), 0 0 0 3px var(--ring);
      }

      /* Align Q bubble to start side */
      [dir="ltr"] .q-btn { align-self: flex-start; }
      [dir="rtl"] .q-btn { align-self: flex-end; }

      /* Answer wrapper (collapsible) */
      .answer-wrap {
        max-width: var(--max-w);
        align-self: flex-end; /* overridden in RTL */
        overflow: hidden;
        max-height: 0;
        transition: max-height var(--speed) var(--easing);
      }
      [dir="rtl"] .answer-wrap { align-self: flex-start; }

      /* Answer bubble */
      .a-box {
        margin-top: 8px;
        padding: 10px 14px;
        border-radius: var(--radius);
        background: var(--bubble-a);
        color: var(--text);
        box-shadow: var(--shadow);
        line-height: 1.6;
        font-size: 15px;
        opacity: 0;
        transform: translateX(var(--slide, 20px));
        transition: opacity var(--speed) var(--easing), transform var(--speed) var(--easing);
      }
      [dir="ltr"] .a-box { --slide: 20px; }
      [dir="rtl"] .a-box { --slide: -20px; }

      /* Open state */
      .answer-wrap.is-open { max-height: 500px; }
      .answer-wrap.is-open .a-box { opacity: 1; transform: translateX(0); }

      /* Respect reduced motion */
      @media (prefers-reduced-motion: reduce) {
        .a-box { transition: opacity var(--speed) var(--easing); transform: none !important; }
      }

      .faq-item { display: flex; flex-direction: column; gap: 8px; }
    </style>
  </head>
  <body>
    <!--
      HOW TO USE
      - Open this file in a browser (double‑click or drag into a tab).
      - For Hebrew, change <html dir="ltr"> to dir="rtl".
      - Duplicate <li class="faq-item"> blocks to add more Q&As.
    -->

    <section class="faq-section" role="region" aria-labelledby="faq-heading" data-structured="true">
      <h2 id="faq-heading" class="faq-heading">Questions & Answers</h2>
      <ul class="faq-list" id="faq-list">
        <li class="faq-item" data-id="q1">
          <button class="q-btn" type="button" aria-expanded="false" aria-controls="wrap-q1">What can I expect in the first session?</button>
          <div id="wrap-q1" class="answer-wrap" aria-hidden="true">
            <div class="a-box" id="a-q1" role="region">
              A gentle get‑to‑know meeting. We’ll talk about what brings you, your goals, and whether this feels like a good fit.
            </div>
          </div>
        </li>
        <li class="faq-item" data-id="q2">
          <button class="q-btn" type="button" aria-expanded="false" aria-controls="wrap-q2">How long is each session?</button>
          <div id="wrap-q2" class="answer-wrap" aria-hidden="true">
            <div class="a-box" id="a-q2" role="region">
              45 minutes. A steady rhythm helps the process.
            </div>
          </div>
        </li>
        <li class="faq-item" data-id="q3">
          <button class="q-btn" type="button" aria-expanded="false" aria-controls="wrap-q3">How often do we meet?</button>
          <div id="wrap-q3" class="answer-wrap" aria-hidden="true">
            <div class="a-box" id="a-q3" role="region">
              Usually weekly, on the same day and time. We can adjust together if needed.
            </div>
          </div>
        </li>
      </ul>
    </section>

    <script>
      (function () {
        const list = document.getElementById('faq-list');
        if (!list) return;

        function closeAll() {
          document.querySelectorAll('.answer-wrap').forEach(wrap => {
            wrap.classList.remove('is-open');
            wrap.setAttribute('aria-hidden', 'true');
          });
          document.querySelectorAll('.q-btn[aria-expanded]').forEach(b => b.setAttribute('aria-expanded', 'false'));
        }

        list.addEventListener('click', function (e) {
          const btn = e.target.closest('.q-btn');
          if (!btn) return;
          const wrapId = btn.getAttribute('aria-controls');
          const wrap = document.getElementById(wrapId);
          const isOpen = wrap.classList.contains('is-open');

          if (isOpen) {
            wrap.classList.remove('is-open');
            wrap.setAttribute('aria-hidden', 'true');
            btn.setAttribute('aria-expanded', 'false');
          } else {
            closeAll();
            wrap.classList.add('is-open');
            wrap.setAttribute('aria-hidden', 'false');
            btn.setAttribute('aria-expanded', 'true');
          }
        });
      })();
    </script>
  </body>
</html>
